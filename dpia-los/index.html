<title>DPIA-los</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
/* Layout: a steady two-column workbench — a sticky step register on the left, one form column on the right; KI output always appears in its own marked card beside the field it concerns. */
:root{
  --paper:#F3F5F6; --surface:#FFFFFF; --sunken:#EBEFF1;
  --ink:#132235; --muted:#56657A; --faint:#8995A4; --line:#D9E0E5;
  --accent:#1B5A61; --accent-ink:#FFFFFF; --accent-soft:#E2EEEE;
  --ki:#5446A8; --ki-soft:#EFEDFA; --ki-line:#CFC8F0;
  --ok:#2F7D4F; --ok-soft:#E3F1E8; --warn:#9A6A00; --warn-soft:#FBF1D9; --bad:#A63A2C; --bad-soft:#F8E4E0;
  --r1:#3E8E5B; --r2:#C59A1C; --r3:#D07A2A; --r4:#B33D2E;
  --r1bg:#DDEFE3; --r2bg:#F7EDCC; --r3bg:#F8E1CB; --r4bg:#F4D6D1;
  --shadow:0 1px 2px rgba(19,34,53,.06),0 4px 16px rgba(19,34,53,.05);
  --f-display:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E151D; --surface:#151F2A; --sunken:#1B2733;
  --ink:#E5EBF0; --muted:#A1AEBB; --faint:#74828F; --line:#273544;
  --accent:#6BB8B8; --accent-ink:#0B1B1E; --accent-soft:#16302F;
  --ki:#AEA2F2; --ki-soft:#1F1C35; --ki-line:#3B3566;
  --ok:#6CC28E; --ok-soft:#14291D; --warn:#E3B34B; --warn-soft:#2B2410; --bad:#EE8B7C; --bad-soft:#331915;
  --r1:#5DB57D; --r2:#D9B23C; --r3:#E59448; --r4:#E2685A;
  --r1bg:#1F4029; --r2bg:#423715; --r3bg:#4A3016; --r4bg:#52251F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E151D; --surface:#151F2A; --sunken:#1B2733;
  --ink:#E5EBF0; --muted:#A1AEBB; --faint:#74828F; --line:#273544;
  --accent:#6BB8B8; --accent-ink:#0B1B1E; --accent-soft:#16302F;
  --ki:#AEA2F2; --ki-soft:#1F1C35; --ki-line:#3B3566;
  --ok:#6CC28E; --ok-soft:#14291D; --warn:#E3B34B; --warn-soft:#2B2410; --bad:#EE8B7C; --bad-soft:#331915;
  --r1:#5DB57D; --r2:#D9B23C; --r3:#E59448; --r4:#E2685A;
  --r1bg:#1F4029; --r2bg:#423715; --r3bg:#4A3016; --r4bg:#52251F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.005em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.82em}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-progress{flex:1;min-width:160px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:6px;background:var(--sunken);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.top-progress small{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;white-space:nowrap}
.top-actions{display:flex;gap:8px;align-items:center}
.save-state{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save-state::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.2;transition:background .15s,border-color .15s}
.btn:hover{background:var(--sunken)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ki{color:var(--ki);border-color:var(--ki-line);background:var(--ki-soft)}
.btn.ki:hover{border-color:var(--ki)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.ki-mark{display:inline-grid;place-items:center;font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.04em;
  border-radius:4px;padding:1px 5px;background:var(--ki);color:var(--surface)}

/* Shell */
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:264px minmax(0,1fr);gap:32px;
  padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start;display:flex;flex-direction:column;gap:2px}
.steps .eyebrow{padding:0 10px 8px}
.step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:0;background:transparent;
  padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted)}
.step:hover{background:var(--sunken);color:var(--ink)}
.step.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.step .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;
  border:1.5px solid var(--line);font-variant-numeric:tabular-nums;background:var(--surface)}
.step.on .dot{border-color:var(--accent);color:var(--accent)}
.step.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step .lbl{font-size:14px;font-weight:500;line-height:1.25}
.step .sub{display:block;font-size:12px;color:var(--faint);font-weight:400;font-variant-numeric:tabular-nums}
.trust-mini{margin-top:18px;padding:14px;border-radius:var(--radius);background:var(--accent-soft);font-size:13px;color:var(--ink);display:grid;gap:8px}
.trust-mini b{font-weight:600}
.trust-mini button{justify-self:start}

main{min-width:0;display:flex;flex-direction:column;gap:20px}
.example-banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border-radius:var(--radius);
  padding:10px 14px;font-size:13.5px}
.example-banner b{color:var(--warn)}
.sec-head{display:grid;gap:8px;max-width:68ch}
.sec-head h1{font-size:30px;line-height:1.15}
.sec-head p{color:var(--muted);font-size:15.5px}
.art{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:12px;color:var(--accent);background:var(--accent-soft);
  padding:2px 8px;border-radius:5px;justify-self:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.form{padding:8px 24px}
.field{display:grid;gap:8px;padding-block:20px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label.q,.field .q{font-weight:600;font-size:15px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.req{color:var(--bad);font-weight:600}
.help{color:var(--muted);font-size:13.5px;max-width:70ch}
input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 12px;
  transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.field-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field-tools .count{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.ki-used{font-size:12px;color:var(--ki);display:inline-flex;gap:5px;align-items:center}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--paper)}
.opt:hover{border-color:var(--faint)}
.opt input{margin:3px 0 0;accent-color:var(--accent);width:16px;height:16px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt b{font-weight:500;display:block}
.opt small{color:var(--muted);font-size:13px}
.opts.inline{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
.grid2 .field{border-bottom:1px solid var(--line)}

/* KI cards */
.ki-card{border:1px solid var(--ki-line);background:var(--ki-soft);border-radius:var(--radius);padding:14px 16px;display:grid;gap:10px}
.ki-card header{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ki);font-weight:600}
.ki-card header .sp{margin-left:auto}
.ki-text{white-space:pre-wrap;font-size:14.5px;color:var(--ink)}
.ki-text.wait{color:var(--muted);font-style:italic}
.ki-actions{display:flex;gap:8px;flex-wrap:wrap}
.ki-note{font-size:12px;color:var(--muted)}
.ki-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.ki-list li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:14px}
.ki-list li::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--warn)}
.ki-list.good li::before{background:var(--ok)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ki);animation:pulse 1.2s infinite ease-in-out}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.bar i{transition:none}}

/* Section footer nav */
.sec-nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sec-nav .sp{flex:1}
.review-box{display:grid;gap:12px}

/* Screening verdict */
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:16px 18px;border-radius:var(--radius)}
.verdict .num{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.verdict.v0{background:var(--ok-soft)}.verdict.v1{background:var(--warn-soft)}.verdict.v2{background:var(--bad-soft)}
.verdict.v0 .num{color:var(--ok)}.verdict.v1 .num{color:var(--warn)}.verdict.v2 .num{color:var(--bad)}
.verdict b{display:block}
.verdict span{font-size:13.5px;color:var(--muted)}

/* Risks */
.risk-top{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.matrix-card{padding:16px}
.matrix-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--paper)}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.matrix{display:grid;grid-template-columns:22px repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,52px) 22px;gap:3px}
.matrix .cell{border-radius:5px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:3px;padding:3px}
.matrix .ax{font-size:10.5px;color:var(--faint);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.matrix .yl{writing-mode:vertical-rl;transform:rotate(180deg)}
.lv1{background:var(--r1bg)}.lv2{background:var(--r2bg)}.lv3{background:var(--r3bg)}.lv4{background:var(--r4bg)}
.chip{font-family:var(--f-mono);font-size:10.5px;font-weight:500;background:var(--surface);color:var(--ink);border-radius:4px;padding:1px 4px;border:1px solid var(--line)}
.axis-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;padding-left:25px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.risk-list{display:grid;gap:14px}
.risk{padding:0;overflow:hidden}
.risk-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
.risk-h .rid{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--accent)}
.risk-h input{flex:1 1 260px;min-width:0;background:transparent;border-color:transparent;font-weight:600;padding:6px 8px}
.risk-h input:hover{border-color:var(--line)}
.risk-b{padding:4px 16px 14px}
.risk-b .field{padding-block:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.lv1{color:var(--r1)}.pill.lv2{color:var(--r2)}.pill.lv3{color:var(--r3)}.pill.lv4{color:var(--r4)}
.pill.lv0{background:var(--sunken);color:var(--muted)}
.scales{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}
.scales .phase{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--muted)}
.scales .phase::after{content:"";flex:1;height:1px;background:var(--line)}
.scales label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.sugg-risk{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--ki-line);border-radius:8px;align-items:start}
.sugg-risk input{margin-top:3px;accent-color:var(--ki)}
.sugg-risk b{display:block;font-weight:600;font-size:14px}
.sugg-risk small{color:var(--muted);font-size:13px;display:block}

/* Start */
.hero{padding:32px;display:grid;gap:18px;background:var(--surface)}
.hero h1{font-size:clamp(28px,4vw,40px);line-height:1.1;max-width:22ch}
.hero p.lead{font-size:16.5px;color:var(--muted);max-width:62ch}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.how > div{padding:18px;display:grid;gap:6px;align-content:start}
.how b{font-family:var(--f-display);font-size:16.5px;font-weight:600}
.how p{font-size:13.5px;color:var(--muted)}
.trust{padding:22px 24px;display:grid;gap:14px}
.trust ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.trust li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;font-size:14px}
.trust li svg{color:var(--accent)}
.trust li b{display:block}
.trust li span{color:var(--muted)}
.outline{display:grid;gap:0}
.outline div{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.outline div:last-child{border-bottom:0}
.outline .n{font-variant-numeric:tabular-nums;color:var(--faint);font-weight:600}

/* Report */
.status-grid{display:grid;gap:0}
.status-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.status-row:last-child{border-bottom:0}
.status-row .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.status-row .ic.ok{background:var(--ok-soft);color:var(--ok)}
.status-row .ic.no{background:var(--warn-soft);color:var(--warn)}
.status-row small{display:block;color:var(--muted);font-size:13px}
.doc-cta{padding:22px 24px;display:grid;gap:14px}
.doc-cta .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.notice{font-size:13.5px;padding:10px 12px;border-radius:8px;background:var(--sunken);color:var(--ink)}
.notice.ok{background:var(--ok-soft)}.notice.bad{background:var(--bad-soft)}
.docprev{padding:28px 32px;font-family:var(--f-body);display:grid;gap:10px;max-height:520px;overflow:auto}
.docprev h2{font-size:20px;margin-top:10px}
.docprev h3{font-size:15px;font-family:var(--f-body);font-weight:600;margin-top:6px}
.docprev p{font-size:14px;white-space:pre-wrap}
.docprev .muted{color:var(--muted)}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,28,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;
  border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer-h h2{font-size:18px;flex:1}
.drawer-b{flex:1;overflow:auto;padding:18px;display:grid;gap:12px;align-content:start}
.drawer-f{border-top:1px solid var(--line);padding:12px 18px;display:grid;gap:8px}
.msg{padding:10px 12px;border-radius:10px;font-size:14px;white-space:pre-wrap;max-width:92%}
.msg.u{background:var(--accent-soft);justify-self:end}
.msg.a{background:var(--ki-soft);border:1px solid var(--ki-line)}
.chat-in{display:flex;gap:8px}
.chat-in textarea{min-height:44px;height:44px}
.suggest-q{display:flex;gap:6px;flex-wrap:wrap}
.suggest-q button{font-size:12.5px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;padding:10px 12px;border-radius:8px;background:var(--bad-soft)}

@media (max-width:980px){
  .risk-top{grid-template-columns:minmax(0,1fr)}
  .matrix-card{order:-1}
}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:18px;padding-block:16px 60px}
  .steps{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:thin}
  .steps .eyebrow,.trust-mini{display:none}
  .step{grid-template-columns:22px auto;flex:none;padding:6px 10px;border:1px solid var(--line);background:var(--surface)}
  .step .dot{width:22px;height:22px;font-size:11px}
  .step .sub{display:none}
  .how{grid-template-columns:minmax(0,1fr)}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .top-progress{order:3;flex-basis:100%}

}
function isVisible(f,s){ return !f.show || f.show(s); }
function filled(v){ return Array.isArray(v) ? v.length>0 : String(v??'').trim()!==''; }
function riskComplete(r){ return filled(r.title)&&filled(r.desc)&&r.s&&r.k&&filled(r.measures)&&r.rs&&r.rk; }
function sectionStatus(sec,s){
  if(sec.kind==='risks'){
    const total=Math.max(1,s.risks.length), done=s.risks.filter(riskComplete).length;
    return {total, done: s.risks.length?done:0, missing: s.risks.length? s.risks.filter(r=>!riskComplete(r)).map((r,i)=>'R'+(s.risks.indexOf(r)+1)+' er ikke fullstendig') : ['Ingen risikoer er registrert']};
  }
  const req=sec.fields.filter(f=>f.req&&isVisible(f,s));
  const miss=req.filter(f=>!filled(s[sec.id][f.id]));
  return {total:req.length, done:req.length-miss.length, missing:miss.map(f=>f.label)};
}
function overall(s){ let t=0,d=0; for(const sec of SECTIONS){const st=sectionStatus(sec,s); t+=st.total; d+=st.done;} return {t,d,complete:t===d}; }
function maxResidual(s){ return s.risks.reduce((m,r)=>Math.max(m,riskLevel(r.rs,r.rk)),0); }

function contextText(s,limit=14000){
  const out=[];
  for(const sec of SECTIONS){
    if(sec.kind==='risks'){ if(s.risks.length){ out.push('## Risikoer'); s.risks.forEach((r,i)=>out.push(`R${i+1} ${r.title||''}: ${r.desc||''} | Før: ${LEVELS[riskLevel(r.s,r.k)]||'ikke vurdert'} | Tiltak: ${r.measures||'ingen'} | Etter: ${LEVELS[riskLevel(r.rs,r.rk)]||'ikke vurdert'}`)); } continue; }
    const lines=[];
    for(const f of sec.fields){ if(!isVisible(f,s)) continue; let v=s[sec.id][f.id];
      if(f.type==='checks') v=(v||[]).map(id=>(CRITERIA.find(c=>c.id===id)||{}).label).filter(Boolean).join('; ');
      if(filled(v)) lines.push(`${f.label}: ${String(v).trim()}`); }
    if(lines.length){ out.push('## '+sec.title); out.push(...lines); }
  }
  const t=out.join('\n'); return t.length>limit? t.slice(0,limit)+'\n[...]' : (t||'(ingenting er fylt ut ennå)');
}

}

function svgI(n){ const p={lock:'<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>',hand:'<path d="M5 12l4 4 10-10"/>',scale:'<path d="M12 4v16M6 20h12M4 9l3-5 3 5a3 3 0 0 1-6 0zM14 9l3-5 3 5a3 3 0 0 1-6 0zM7 4h10"/>'}[n];

function sectionView(sec){

function verdictHTML(){

function fieldHTML(sec,f){

function matrixHTML(){

      cells+=`<div class="cell lv${riskLevel(s,k)}" title="${LIKELIHOOD[s]} × ${CONSEQUENCE[k]}: ${LEVELS[riskLevel(s,k)]}">${ids}</div>`; }

  return `<div class="matrix-head"><b style="font-weight:600;font-size:14px">Risikomatrise</b><div class="seg" role="group" aria-label="Vis"><button type="button" data-act="mx" data-v="before" class="${!res?'on':''}">Før tiltak</button><button type="button" data-act="mx" data-v="after" class="${res?'on':''}">Etter tiltak</button></div></div>

}

OPPGAVE: Foreslå de viktigste risikoene for de registrertes rettigheter og friheter ved behandlingen beskrevet under. Risiko skal vurderes fra de registrertes perspektiv (ikke virksomhetens). Unngå risikoer som allerede er registrert.

"""

async function sendChat(q){
  q=String(q||'').trim(); if(!q||!sample) return;
  chatTurns.push({role:'user',content:q}); openDrawer('chat');
  const log=$('#chatLog'); const bubble=document.createElement('div'); bubble.className='msg a'; bubble.textContent='Tenker …'; log.appendChild(bubble); log.scrollTop=log.scrollHeight;
  const rules=`${ROLE}\nSvar kort og konkret (normalt under 200 ord), og henvis til relevante artikler. Si fra når noe bør avklares med personvernombudet eller jurist.\n\nVURDERINGEN SÅ LANGT:\n"""\n${contextText(S,10000)}\n"""`;
  const turns=[{role:'user',content:rules},...chatTurns.slice(-10)];
  aiCtl.chat?.abort(); const ctl=aiCtl.chat=new AbortController();
  try{ const {text}=await sample(turns,{cache:false,signal:ctl.signal,onText:({text})=>{bubble.textContent=text; log.scrollTop=log.scrollHeight;}});
    chatTurns.push({role:'assistant',content:text}); bubble.textContent=text;
  }catch(e){ bubble.textContent=e.text||aiErr(e); }
}

function safeName(s){ return String(s||'DPIA').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim().slice(0,90); }
async function saveFile(filename,data,okMsg){

  catch(e){ if(e.code==='declined') return; if(msg) msg.innerHTML=`<div class="notice bad">${e.code==='rate_limited'?'En nedlasting venter allerede. Prøv igjen om litt.':'Filen kunne ikke lagres. Prøv igjen.'}</div>`; }

function downloadDocx(draft){

});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#overlay').innerHTML) $('#overlay').innerHTML='';
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='chatInput'){ e.preventDefault(); sendChat(e.target.value); }
});
$('#openChat').addEventListener('click',()=>openDrawer('chat'));

/* ---------- Boot ---------- */
if(step<0||step>SECTIONS.length) step=0;
render();
(async()=>{
  if(!window.claude?.use){ $('#openChat').hidden=true; return; }
  const [smp,dl]=await Promise.all([claude.use('sample').catch(()=>null),claude.use('downloads').catch(()=>null)]);
  sample=smp; downloads=dl;
  if(!sample) $('#openChat').hidden=true;
  render(true);
})();
</script>
